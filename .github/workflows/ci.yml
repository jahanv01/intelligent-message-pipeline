name: CI

# Runs on every push/PR. Uses only fabricated test data (tests/) —
# the real dataset is never committed to this repo, so CI never touches it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest tests/ -v --tb=short

      # Diagnostic aid: if a test run fails, the logs it produced (from
      # local pipeline runs the tests trigger) are uploaded so the failure
      # can be inspected without re-running locally. These logs only ever
      # contain fabricated test data, never the real dataset.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/
          if-no-files-found: ignore
